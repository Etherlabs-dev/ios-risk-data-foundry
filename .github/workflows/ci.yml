name: CI

on:
  push:
    branches:
      - main
      - "portfolio-upgrade/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint and formatting checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit tests
        run: python -m pytest -v

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --tag ios-risk-data-foundry:test .

      - name: Run container test command
        run: docker run --rm ios-risk-data-foundry:test
