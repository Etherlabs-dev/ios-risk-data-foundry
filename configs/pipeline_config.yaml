# IOS Risk Data Foundry — Pipeline Configuration
# All tunable parameters live here. Nothing hardcoded in source files.

pipeline:
  seed: 42

sources:
  fraud_transactions:
    enabled: true
    raw_path: data/raw/creditcard.csv
    output_path: data/processed/fraud_transaction_pairs.jsonl

  # DO NOT ENABLE. Superseded by bsa_regulations. This path templates its
  # answer from the search query rather than the filing text, so every chunk
  # retrieved for one query shares an identical fabricated answer. See
  # foundry/sources/bsa_regulations.py for the replacement and the reasoning.
  sec_edgar:
    enabled: false
    output_path: data/processed/edgar_risk_chunks.jsonl
    queries:
      - "fraud risk financial institution"
      - "AML compliance bank"
      - "credit default risk fintech"
      - "cybersecurity breach financial services"
      - "operational risk payment processing"
    limit_per_query: 10
    chunk_size: 512
    chunk_overlap: 64

  synthetic:
    enabled: false
    output_path: data/processed/synthetic_transactions.jsonl
    n_fraud: 2000
    n_legit: 8000
    seed: 42

  # Fraud Scenario Factory — the only source that produces risk TIERS and
  # written reasoning rather than bare labels. It was generated for v1 (see
  # dataset_manifest.json) but never registered here or in merger.py, so it
  # never reached the published dataset. That is why v1 has one instruction
  # and two outputs.
  # 31 CFR Chapter X via the public eCFR API — real regulatory language with
  # real citations. Replaces sec_edgar.
  bsa_regulations:
    enabled: true
    output_path: data/processed/bsa_regulation_pairs.jsonl
    date: "2026-01-01"
    variants_per_section: 4

  synthetic_scenarios:
    enabled: true
    output_path: data/processed/synthetic_scenario_pairs.jsonl
    n_fraud: 2000
    n_legit: 8000
    seed: 42

exports:
  # v2 supersedes v1. v1 shipped tabular-only (1 instruction, 2 outputs,
  # 99.1% imbalance) because synthetic/sec_edgar were disabled and the
  # scenario pairs were never a registered source. See scripts/build_finetune_v2.py.
  instruction_pairs_path: data/exports/ios_risk_finetune_v2.jsonl
  hf_dataset_name: ios-risk-finetune-v2
